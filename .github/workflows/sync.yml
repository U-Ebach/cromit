name: Sync

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  sync:
    runs-on: ubuntu-slim
    outputs:
      has_changes: ${{ steps.sync-upstream.outputs.has_updates }}
    steps:
      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install jq gh
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Get Last Stable Tag
        id: last-tag
        run: |
          TAG=$(gh api repos/uazo/cromite/tags | jq -r 'first(.[] | select(.name | test("^v\\d+ \\. \\d+ \\. \\d+ \\. \\d+ - \\w{40}$"; "ix"))) | .name')

          echo "Last stable tag is $TAG"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Sync w Upstream
        id: sync-upstream
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git config --global merge.ours.driver true

          git remote add upstream "https://github.com/$UP_REPO"
          git fetch upstream --tags

          OLD_HASH=$(git rev-parse HEAD)

          if git merge $UP_TAG --allow-unrelated-histories -m "feat: merge w upstream"; then
            echo "Merge completed"
            
            NEW_HASH=$(git rev-parse HEAD)
            
            if [ "$OLD_HASH" != "$NEW_HASH" ]; then
              echo "has_updates=true" >> $GITHUB_OUTPUT
              
              git push origin master
              echo "Master updated"
            else
              echo "has_updates=false" >> $GITHUB_OUTPUT
              echo "There's no changes"
            fi
          else
            echo "Merge conflicts! Manual intervention is required."
            
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi
          
        env: 
          UP_REPO: 'uazo/cromite'
          UP_TAG: ${{ steps.last-tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    needs: sync
    if: needs.sync.outputs.has_changes == 'true'
    uses: ./.github/workflows/build-webview.yml
