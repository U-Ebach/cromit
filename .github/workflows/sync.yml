name: Sync

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0
      - name: Sync w Upstream
        id: sync-upstream
        uses: a0a/upstream-sync-action@v2
        with: 
          upstream_repository: uazo/cromite
          upstream_branch: master
          target_branch: master
      - name: Fetch n check
        id: fetch-check
        run: |
          git fetch --tags https://github.com/uazo/cromite.git
          
          LATEST_TAG=$(git tag -l | sort -V | tail -n 1)
          echo "Latest tag is $LATEST_TAG"
          
          if ! git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            echo "It seems the original repo has updated"
            
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"

            git tag $LATEST_TAG
            git push origin $LATEST_TAG
          else
            echo "Nothing new. Skipping"
          fi
